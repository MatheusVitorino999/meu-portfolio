<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buscador de Clima</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            color: white;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .card {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 20px;
            padding: 40px;
            max-width: 400px;
            width: 100%;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            text-align: center;
        }
        h1 { font-size: 24px; margin-bottom: 5px; }
        .subtitulo { color: #a0a0c0; font-size: 13px; margin-bottom: 20px; }
        .busca { display: flex; gap: 8px; margin-bottom: 20px; }
        #input-cidade {
            flex: 1;
            padding: 12px 16px;
            border-radius: 30px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            background: rgba(255, 255, 255, 0.08);
            color: white;
            font-size: 14px;
            outline: none;
        }
        #input-cidade::placeholder { color: #888; }
        .btn {
            background: rgba(255, 255, 255, 0.1);
            color: white;
            padding: 12px 24px;
            border-radius: 30px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            cursor: pointer;
            font-size: 14px;
            transition: 0.3s;
            white-space: nowrap;
        }
        .btn:hover { background: rgba(255, 255, 255, 0.2); }
        .resultado {
            display: none;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 16px;
            padding: 25px;
            margin-top: 10px;
        }
        .resultado.visivel { display: block; }
        .cidade-nome { font-size: 22px; font-weight: bold; margin-bottom: 5px; }
        .temperatura { font-size: 56px; font-weight: bold; color: #00ff88; }
        .descricao { color: #a0a0c0; font-size: 16px; margin: 8px 0; }
        .info-extra { display: flex; justify-content: center; gap: 25px; margin-top: 15px; font-size: 14px; color: #d0d0e0; }
        .erro-api { color: #ff6b6b; font-size: 14px; display: none; margin-top: 10px; }
        .erro-api.visivel { display: block; }
        .voltar { margin-top: 25px; }
        .voltar a {
            color: #a0a0c0;
            text-decoration: none;
            font-size: 13px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 8px 18px;
            border-radius: 30px;
            transition: 0.3s;
        }
        .voltar a:hover { background: rgba(255, 255, 255, 0.1); color: white; }
    </style>
</head>
<body>
    <div class="card">
        <h1>🌤️ Buscador de Clima</h1>
        <p class="subtitulo">Digite uma cidade e veja o clima agora</p>
        <div class="busca">
            <input type="text" id="input-cidade" placeholder="Ex: Rio de Janeiro">
            <button class="btn" id="btn-buscar">🔍 Buscar</button>
        </div>
        <p class="erro-api" id="erro-api">Cidade não encontrada. Tente novamente.</p>
        <div class="resultado" id="resultado">
            <div class="cidade-nome" id="cidade-nome"></div>
            <div class="temperatura" id="temperatura"></div>
            <div class="descricao" id="descricao"></div>
            <div class="info-extra">
                <span>💧 <span id="umidade"></span>%</span>
                <span>💨 <span id="vento"></span> km/h</span>
            </div>
        </div>
        <div class="voltar">
            <a href="index.html">← Voltar ao Portfólio</a>
        </div>
    </div>

    <script>
        const API_KEY = "bd5e378503939ddaee76f12ad7a97608";
        const inputCidade = document.getElementById("input-cidade");
        const btnBuscar = document.getElementById("btn-buscar");
        const resultado = document.getElementById("resultado");
        const erroApi = document.getElementById("erro-api");
        const cidadeNome = document.getElementById("cidade-nome");
        const temperatura = document.getElementById("temperatura");
        const descricao = document.getElementById("descricao");
        const umidade = document.getElementById("umidade");
        const vento = document.getElementById("vento");

        btnBuscar.addEventListener("click", function () {
            const cidade = inputCidade.value.trim();
            if (cidade === "") return;

            erroApi.classList.remove("visivel");
            resultado.classList.remove("visivel");

            const url = `https://api.openweathermap.org/data/2.5/weather?q=${cidade}&appid=${API_KEY}&units=metric&lang=pt_br`;

            fetch(url)
                .then(function (resposta) {
                    if (!resposta.ok) {
                        throw new Error("Cidade não encontrada");
                    }
                    return resposta.json();
                })
                .then(function (dados) {
                    cidadeNome.textContent = `${dados.name}, ${dados.sys.country}`;
                    temperatura.textContent = `${Math.round(dados.main.temp)}°C`;
                    descricao.textContent = dados.weather[0].description;
                    umidade.textContent = dados.main.humidity;
                    vento.textContent = dados.wind.speed;
                    resultado.classList.add("visivel");
                })
                .catch(function () {
                    erroApi.classList.add("visivel");
                });
        });
    </script>
</body>
</html>
